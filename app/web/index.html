<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SkyLens: a free personal observatory. Sky map, AR sky view and NASA data.">
  <meta name="theme-color" content="#070A12">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SkyLens">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SkyLens</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #070A12; }
    /* Shown until Flutter draws its first frame, then removed. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font: 600 20px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #EDF1F8; letter-spacing: -0.2px;
      transition: opacity 240ms ease-out;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: #161D30;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #7EA6FF; border-radius: 3px;
      animation: load 1.2s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading SkyLens">
    <img src="icons/Icon-192.png" alt="">
    <div>SkyLens</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
